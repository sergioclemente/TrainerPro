[package]
name = "tp-core"
version = "0.1.0"
edition = "2021"
description = "TrainerPro pure domain: workout parsers, engine, metrics, ride journal, FIT codec"
license = "MIT"
repository = "https://github.com/sergioclemente/TrainerPro"

[features]
workout-schema = ["dep:schemars"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
roxmltree = { workspace = true }
fitparser = "=0.11.0"
schemars = { version = "1.2", optional = true }
