[package]
name = "tp-ble"
version = "0.1.0"
edition = "2021"
description = "TrainerPro BLE layer: per-connection traits, FTMS + HRM drivers, simulator"
license = "MIT"
repository = "https://github.com/sergioclemente/TrainerPro"

[dependencies]
tp-core = { path = "../tp-core" }
serde = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
btleplug = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "test-util"] }
