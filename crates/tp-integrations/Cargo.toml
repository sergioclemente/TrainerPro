[package]
name = "tp-integrations"
version = "0.1.0"
edition = "2021"
description = "Reusable Garmin and Intervals.icu provider clients"
license = "MIT"
repository = "https://github.com/sergioclemente/TrainerPro"

[dependencies]
reqwest = { workspace = true, features = ["multipart", "cookies"] }
