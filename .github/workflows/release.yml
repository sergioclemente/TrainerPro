# Build and package TrainerPro for macOS and Windows.
#
# You cannot cross-build these: a macOS .dmg must be built on macOS and a
# Windows .msi/.exe on Windows, so this is a runner matrix. Linux is
# unsupported (SPEC §1). tauri-action runs `tauri build` per OS, which triggers
# the beforeBuildCommand (npm run build), then attaches the installers to a
# GitHub release.
#
# Trigger: push a tag like `v0.1.0`, or run manually from the Actions tab.
#
# Signing is OFF here — this produces INSTALLABLE-BUT-UNSIGNED artifacts good
# for testing. Real releases must be signed, or users hit Gatekeeper (macOS)
# and SmartScreen "unknown publisher" (Windows). The commented env slots below
# are where the credentials go once you have them:
#   - macOS: an Apple Developer ID cert + notarization (Apple Developer acct).
#   - Windows: an Authenticode cert — Azure Trusted Signing is the cheapest
#     CI-friendly route (see the packaging notes).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    permissions:
      contents: write # create/upload the release
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal macOS binary (Apple Silicon + Intel) → one .dmg.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build, bundle, and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- macOS signing + notarization (leave unset for an unsigned build) ---
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}                 # base64 of the .p12
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}       # "Developer ID Application: …"
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}                       # app-specific password
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          #
          # --- Windows Authenticode signing (leave unset for an unsigned build) ---
          # Wire your signer here (e.g. Azure Trusted Signing action before this step,
          # or Tauri's bundle.windows.signCommand pointing at your signtool call).
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "TrainerPro ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
