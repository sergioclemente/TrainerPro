[workspace]
resolver = "2"
members = ["backend", "crates/tp-core", "crates/tp-ble"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
roxmltree = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
async-trait = "0.1"
tracing = "0.1"
futures = "0.3"
btleplug = "0.12"
