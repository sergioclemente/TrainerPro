[package]
name = "tp-app"
version = "0.1.0"
edition = "2021"
description = "TrainerPro — indoor cycling workout player"
license = "MIT"
repository = "https://github.com/sergioclemente/TrainerPro"

[features]
default = []
simulator = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tp-core = { path = "../crates/tp-core" }
tp-ble = { path = "../crates/tp-ble" }
async-trait = { workspace = true }
futures = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
regex = "1"
